# Dependabot covers GitHub Actions (SHA-pinned `uses:` lines), the hash-locked
# CI Python tooling and the one npm dependency that ships to apply runners (pg,
# used by modules/supabase/vault-secrets with production database credentials).
# Renovate (renovate.json) owns everything else: Terraform providers and
# .terraform.lock.hcl files, the toolchain (.tool-versions, .terraform-version,
# .tflint.hcl plugins, tool versions inside workflows such as TERRAFORM_VERSION)
# and the pre-commit hook revs. Each dependency has exactly one owner, so the
# two bots never edit the same line. Do not add a terraform, pre-commit or
# docker ecosystem here, and do not enable Renovate's github-actions, pip or
# npm managers.
#
# Required one-time repo setup (labels must exist or PR creation warns):
#   gh label create dependencies --force
#   gh label create github-actions --force
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # Hash-locked CI tooling: commitizen (conventional-commit check), zizmor
  # (GitHub Actions static analysis), yamllint
  # (script tests) and python-hcl2 (scripts/check-plan-time-exec.py). Dependabot
  # regenerates each --generate-hashes lock from its .in file.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    groups:
      ci-python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # pg for the vault-secrets bootstrap/reconcile scripts. package.json pins an
  # exact version and package-lock.json carries the integrity hash; Dependabot
  # bumps both together. fix(deps) so the bump is visible in the changelog
  # (it changes code that runs with production credentials).
  - package-ecosystem: "npm"
    directory: "/modules/supabase/vault-secrets/scripts"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
