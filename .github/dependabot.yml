# Dependabot covers GitHub Actions (SHA-pinned) and the hash-locked CI Python
# tooling. Terraform providers and .terraform.lock.hcl files are owned by
# Renovate (renovate.json), so there is deliberately no terraform ecosystem here.
#
# Required one-time repo setup (labels must exist or PR creation warns):
#   gh label create dependencies --force
#   gh label create github-actions --force
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # Hash-locked CI tooling (commitizen for the conventional-commit check).
  # Dependabot regenerates the --generate-hashes lock from commitizen.in.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    groups:
      ci-python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
