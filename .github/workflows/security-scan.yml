name: Security Scan

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.checkov.yaml'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:

# Read-only by default. Only the two jobs that upload SARIF get
# security-events: write (actions: read lets upload-sarif read the run on a
# private fork).
permissions:
  contents: read

concurrency:
  # Scheduled scans get their own concurrency group so a push to main never
  # cancels a running nightly scan (which would leave SARIF results unpublished).
  # Push/PR runs within the same ref still cancel each other to save runners.
  group: security-scan-${{ github.event_name == 'schedule' && 'scheduled' || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# `shell: bash` runs every `run:` step as `bash -eo pipefail`: GitHub's
# default (no shell set) is `bash -e` without pipefail, so `cmd | tee log`
# would pass when cmd fails (scripts/check-workflow-pipefail.py).
defaults:
  run:
    shell: bash

jobs:
  static-analysis:
    name: Trivy + Checkov
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-security.yml
    with:
      sarif_output: true

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # Egress/process audit for this job (audit mode: observe, never block).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy scanner
        # Scope decision: Trivy intentionally scans the whole repo, including
        # `examples/` and `modules/*/examples/*`. tfsec excludes examples via
        # `--exclude-path examples` (see Makefile) because example roots are
        # deliberately minimal/illustrative and would otherwise generate noisy
        # tfsec findings; Checkov has no example skip-path and already scans
        # them. Examples are real Terraform that gets `terraform init`/`validate`/
        # tested in CI, so holding them to Trivy's CRITICAL/HIGH bar is intentional
        # defense-in-depth rather than an oversight.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          skip-dirs: '.terraform'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This job holds GITLEAKS_LICENSE. Every endpoint it calls, from its steps:
      # - github.com: checkout and the gitleaks release download.
      # - release-assets.githubusercontent.com and objects.githubusercontent.com:
      #   the release asset hosts the download redirects to.
      # - api.github.com: gitleaks-action reads the latest release and, on a
      #   pull request, its commits.
      # The Actions cache and artifact hosts are allowed by harden-runner itself.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2 requires a GITLEAKS_LICENSE for repos owned by a
          # GitHub *organization*. Harmless (ignored) for user-owned repos where the
          # secret is unset; provision the secret before migrating this repo to an org
          # or the secret-scan job will start failing.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static-analysis, trivy, secret-scan]
    if: always()
    steps:
      # Egress/process audit for this job (audit mode: observe, never block).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Generate Summary
        env:
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Security Scan Summary"
            echo ""
            echo "| Scanner | Status |"
            echo "|---------|--------|"
            echo "| Trivy + Checkov | ${STATIC_RESULT} |"
            echo "| Trivy | ${TRIVY_RESULT} |"
            echo "| Secret Scan | ${SECRET_RESULT} |"
            echo ""
            echo "View detailed results in the [Security tab](https://github.com/${REPO}/security/code-scanning)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for failures
        if: >-
          needs.static-analysis.result == 'failure' ||
          needs.trivy.result == 'failure' ||
          needs.secret-scan.result == 'failure'
        env:
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
        run: |
          failed=""
          [ "${STATIC_RESULT}" = "failure" ] && failed="${failed} Trivy+Checkov"
          [ "${TRIVY_RESULT}" = "failure" ]  && failed="${failed} Trivy"
          [ "${SECRET_RESULT}" = "failure" ] && failed="${failed} GitLeaks"
          echo "::error::Security scan(s) failed:${failed}. Check the Security tab for details."
          exit 1
