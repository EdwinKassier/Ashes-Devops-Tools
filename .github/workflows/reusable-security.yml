name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      sarif_output:
        description: "Whether to generate and upload SARIF results to GitHub Security"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  # Trivy is the blocking IaC misconfiguration gate. It replaces tfsec, which is
  # end-of-life (Aqua folded it into Trivy) and whose rule set no longer advances.
  # Severity CRITICAL,HIGH matches the already-green post-merge Trivy scan in
  # security-scan.yml, so promoting it to the PR gate does not move the bar.
  # Trivy recurses the whole tree natively (no --force-all-dirs needed). Suppress
  # false positives in a .trivyignore file, never by lowering the severity floor.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run Trivy config scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-dirs: '.terraform'
          format: 'table'

      - name: Generate Trivy SARIF
        if: inputs.sarif_output && always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          skip-dirs: '.terraform'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        if: inputs.sarif_output && always()
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-config

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run Checkov on modules
        uses: bridgecrewio/checkov-action@4048c972aae68d0b983a48bb3479aab2d877b898  # v12
        with:
          directory: modules
          framework: terraform
          quiet: true
          soft_fail: false
          # Do NOT download/scan external modules: we scan our OWN Terraform
          # (checkov reads our modules' .tf regardless). Downloading and scanning
          # third-party code (e.g. terraform-google-modules/project-factory) surfaces
          # violations in code we do not own/control, which fails the scan. This
          # matches the local `make security` gate (which does not download).
          download_external_modules: false
          config_file: .checkov.yaml
          output_format: ${{ inputs.sarif_output && 'sarif,cli' || 'cli' }}
          output_file_path: ${{ inputs.sarif_output && 'checkov-results.sarif,checkov-report.txt' || 'console' }}

      - name: Run Checkov on envs
        # always() so a finding in the modules scan above does not skip this step and
        # leave checkov-env-results.sarif uncreated (which would fail the upload).
        if: always()
        uses: bridgecrewio/checkov-action@4048c972aae68d0b983a48bb3479aab2d877b898  # v12
        with:
          directory: envs
          framework: terraform
          quiet: true
          soft_fail: false
          # See rationale on the modules invocation above.
          download_external_modules: false
          config_file: .checkov.yaml
          output_format: ${{ inputs.sarif_output && 'sarif,cli' || 'cli' }}
          output_file_path: >-
            ${{ inputs.sarif_output && 'checkov-env-results.sarif,checkov-env-report.txt' || 'console' }}

      - name: Upload Checkov modules SARIF
        if: inputs.sarif_output && always()
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Upload Checkov envs SARIF
        if: inputs.sarif_output && always()
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        with:
          sarif_file: checkov-env-results.sarif
          category: checkov-envs

      - name: Upload Checkov report artifact
        if: inputs.sarif_output && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: checkov-report
          path: |
            checkov-report.txt
            checkov-env-report.txt
