name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      sarif_output:
        description: "Whether to generate and upload SARIF results to GitHub Security"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  # Trivy is the blocking IaC misconfiguration gate. It replaces tfsec, which is
  # end-of-life (Aqua folded it into Trivy) and whose rule set no longer advances.
  # Severity CRITICAL,HIGH matches the already-green post-merge Trivy scan in
  # security-scan.yml, so promoting it to the PR gate does not move the bar.
  # Trivy recurses the whole tree natively (no --force-all-dirs needed). Suppress
  # false positives in a .trivyignore file, never by lowering the severity floor.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Egress/process audit for this job (audit mode: observe, never block).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Trivy config scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          # Pin the Trivy binary explicitly (keep equal to .tool-versions, which
          # `make security` enforces locally) instead of inheriting the action's
          # default, so an action bump cannot silently change the rule set.
          version: 'v0.70.0'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-dirs: '.terraform'
          format: 'table'

      - name: Generate Trivy SARIF
        if: inputs.sarif_output && always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          version: 'v0.70.0'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          skip-dirs: '.terraform'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        if: inputs.sarif_output && always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4.39.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-config

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Egress/process audit for this job (audit mode: observe, never block).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Checkov on modules
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa  # v12
        with:
          directory: modules
          framework: terraform
          quiet: true
          soft_fail: false
          # Do NOT download/scan external modules: we scan our OWN Terraform
          # (checkov reads our modules' .tf regardless). Downloading and scanning
          # third-party code (e.g. terraform-google-modules/project-factory) surfaces
          # violations in code we do not own/control, which fails the scan. This
          # matches the local `make security` gate (which does not download).
          download_external_modules: false
          config_file: .checkov.yaml
          output_format: ${{ inputs.sarif_output && 'sarif,cli' || 'cli' }}
          output_file_path: ${{ inputs.sarif_output && 'checkov-results.sarif,checkov-report.txt' || 'console' }}

      - name: Run Checkov on envs
        # always() so a finding in the modules scan above does not skip this step and
        # leave checkov-env-results.sarif uncreated (which would fail the upload).
        if: always()
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa  # v12
        with:
          directory: envs
          framework: terraform
          quiet: true
          soft_fail: false
          # See rationale on the modules invocation above.
          download_external_modules: false
          config_file: .checkov.yaml
          output_format: ${{ inputs.sarif_output && 'sarif,cli' || 'cli' }}
          output_file_path: >-
            ${{ inputs.sarif_output && 'checkov-env-results.sarif,checkov-env-report.txt' || 'console' }}

      - name: Upload Checkov modules SARIF
        if: inputs.sarif_output && always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4.39.2
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Upload Checkov envs SARIF
        if: inputs.sarif_output && always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4.39.2
        with:
          sarif_file: checkov-env-results.sarif
          category: checkov-envs

      - name: Upload Checkov report artifact
        if: inputs.sarif_output && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: checkov-report
          path: |
            checkov-report.txt
            checkov-env-report.txt
