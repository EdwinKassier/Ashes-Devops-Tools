name: Release

# Repository-level SemVer releases (vX.Y.Z) driven by Conventional Commits.
# On every push to main, release-please opens or updates a single release PR
# that bumps .release-please-manifest.json and prepends CHANGELOG.md. Merging
# that PR creates the vX.Y.Z tag and GitHub Release.
#
# These repo tags (vX.Y.Z) intentionally do NOT match the per-workspace
# deployment tag patterns in terraform-apply.yml (gcp-organization/v*, ...),
# so cutting a repo release never triggers release-metadata runs.
#
# Config: release-please-config.json (+ .release-please-manifest.json).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Secrets for this job live in the `release` GitHub environment, restricted
    # to the default branch (docs/guides/CI_SECRETS.md "Environment-scoped
    # secrets"). A repo-level secret is readable by a workflow pushed to ANY
    # branch; an environment secret only by runs its branch policy allows.
    environment: release
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write       # create the vX.Y.Z tag and GitHub Release
      pull-requests: write  # open/update the release PR
      issues: write         # create the autorelease labels on first run
    steps:
      # This job holds the release App private key. The App token step and
      # release-please talk only to the GitHub API (REST and GraphQL) and
      # nothing is checked out, so all other egress is blocked.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # Fail fast and loudly instead of falling back to GITHUB_TOKEN. A release
      # PR opened with GITHUB_TOKEN does not trigger pull_request workflows, so
      # it never receives the required "Validation Summary" check and can never
      # merge under branch protection: a silent fallback just produces a stuck
      # PR. Setup: docs/guides/CI_SECRETS.md#release_app.
      - name: Require the release App
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "${APP_ID}" ] || [ "${HAS_KEY}" != "true" ]; then
            {
              echo "The release GitHub App is not configured. Set the variable RELEASE_APP_ID and"
              echo "the secret RELEASE_APP_PRIVATE_KEY in the release environment."
              echo "See docs/guides/CI_SECRETS.md#release_app. Forks that do not cut releases"
              echo "can disable this workflow (Actions > Release > Disable workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
            msg="Set variable RELEASE_APP_ID and secret RELEASE_APP_PRIVATE_KEY"
            msg="${msg} in the release environment (docs/guides/CI_SECRETS.md#release_app)."
            echo "::error title=Release App missing::${msg}"
            exit 1
          fi

      # The release bot GitHub App (contents, pull requests, issues: write on
      # this repository only). Its token lasts one hour and is minted per run,
      # so no long-lived PAT exists.
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to what release-please needs, on this repository only.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # App installation token (minted above). Never GITHUB_TOKEN: see the
          # rationale on "Require the release App".
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarize
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: echo "Released ${TAG_NAME}" >> "$GITHUB_STEP_SUMMARY"
