name: Release

# Repository-level SemVer releases (vX.Y.Z) driven by Conventional Commits.
# On every push to main, release-please opens or updates a single release PR
# that bumps .release-please-manifest.json and prepends CHANGELOG.md. Merging
# that PR creates the vX.Y.Z tag and GitHub Release.
#
# These repo tags (vX.Y.Z) intentionally do NOT match the per-workspace
# deployment tag patterns in terraform-apply.yml (gcp-organization/v*, ...),
# so cutting a repo release never triggers release-metadata runs.
#
# Config: release-please-config.json (+ .release-please-manifest.json).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # create the vX.Y.Z tag and GitHub Release
      pull-requests: write  # open/update the release PR
      issues: write         # create the autorelease labels on first run
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # Prefer a machine-account PAT (RELEASE_PLEASE_TOKEN, `repo` scope):
          # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows,
          # so the release PR would never get the required "Validation Summary"
          # check and could not merge under branch protection. GITHUB_TOKEN is
          # only the first-time-setup / fork fallback.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarize
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: echo "Released ${TAG_NAME}" >> "$GITHUB_STEP_SUMMARY"
