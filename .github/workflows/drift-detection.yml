name: Drift Detection

# Fallback drift check for HCP Terraform tiers without health assessments.
# Where the tier has them, tfc-admin turns them on for every workspace
# (enable_health_assessments, default true) and HCP itself reports drift; this
# workflow then duplicates that signal and may be opted out of (below).
#
# Required repository configuration (see docs/guides/CI_SECRETS.md):
#   - secrets.TFC_TOKEN_DRIFT  Terraform Cloud team token with QUEUE PLANS (write)
#                              permission on the target workspaces. Drift detection
#                              creates speculative, plan-only+refresh runs
#                              (POST /runs), which READ access alone cannot do.
#                              Keep this separate from the read-only TFC_TOKEN used
#                              by the release workflow. There is NO fallback to
#                              TFC_TOKEN: the read-only release token must never
#                              be granted queue-plans, so a missing
#                              TFC_TOKEN_DRIFT fails the run (see below).
#   - vars.TFC_ORGANIZATION    Terraform Cloud organization name.
#   - vars.TFC_DRIFT_WORKSPACES  (optional) JSON array of workspace names to check.
#                              Defaults to the GCP control plane, gcp-workload-dev
#                              and the AWS guardrail workspaces (aws-organization,
#                              aws-security, aws-network). Set it to the workspaces
#                              this estate actually has.
# Nothing is skipped silently: a drift check that never ran must not show green.
#   - TFC_TOKEN_DRIFT/TFC_ORGANIZATION not configured: the run FAILS.
#   - A listed workspace does not exist in the organization: its leg FAILS.
# To acknowledge that this estate runs without the check, set the repository
# variable REAL_CLOUD_CHECKS_OPT_OUT=true. Unconfigured credentials (scheduled
# runs only; a manual dispatch still fails) and missing workspaces are then
# skipped with a warning, and the summary says "did NOT run", never "no
# drift". (sandbox-e2e.yml honours the same variable.)

on:
  schedule:
    - cron: '0 8 * * 1-5'  # Weekdays at 08:00 UTC
  workflow_dispatch:
    inputs:
      workspaces:
        description: >
          Comma-separated list of TFC workspace names to check for drift.
          Defaults to the standard set when left blank.
          Example: gcp-organization,gcp-workload-dev,gcp-workload-prod
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-detection
  cancel-in-progress: false

jobs:
  check-credentials:
    name: Check Terraform Cloud credentials
    runs-on: ubuntu-latest
    # Secrets for this job live in the `tfc-drift` GitHub environment, restricted
    # to the default branch (docs/guides/CI_SECRETS.md "Environment-scoped
    # secrets"). A repo-level secret is readable by a workflow pushed to ANY
    # branch; an environment secret only by runs its branch policy allows.
    environment: tfc-drift
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # Egress/process audit for this job (audit mode: observe, never block).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Check whether TFC_TOKEN_DRIFT / TFC_ORGANIZATION are configured
        id: check
        # `secrets.*` cannot be referenced directly in a job-level `if:`, so we
        # evaluate it here (where secrets ARE available) and expose a plain
        # job output that downstream `if:` conditions can safely read.
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN_DRIFT }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          OPT_OUT: ${{ vars.REAL_CLOUD_CHECKS_OPT_OUT }}
        run: |
          if [ -n "$TFC_TOKEN" ] && [ -n "$TFC_ORGANIZATION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$OPT_OUT" = "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "::warning::Drift detection NOT run: TFC_TOKEN_DRIFT/TFC_ORGANIZATION are" \
                "not configured and REAL_CLOUD_CHECKS_OPT_OUT=true. Drift is unmonitored."
              exit 0
            fi
            echo "::error::TFC_TOKEN_DRIFT (secret) and/or TFC_ORGANIZATION (variable)" \
              "are not configured, so drift detection cannot run. Configure them" \
              "(docs/guides/CI_SECRETS.md) or set the repository variable" \
              "REAL_CLOUD_CHECKS_OPT_OUT=true to acknowledge running without it."
            exit 1
          fi

  detect-drift:
    name: Detect Drift (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    # Secrets for this job live in the `tfc-drift` GitHub environment, restricted
    # to the default branch (docs/guides/CI_SECRETS.md "Environment-scoped
    # secrets"). A repo-level secret is readable by a workflow pushed to ANY
    # branch; an environment secret only by runs its branch policy allows.
    environment: tfc-drift
    timeout-minutes: 30
    needs: check-credentials
    if: needs.check-credentials.outputs.configured == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Workspace set: the TFC_DRIFT_WORKSPACES repository variable (a JSON
        # array), else the inline default below. Workload workspaces are named
        # gcp-workload-<env> / aws-workload-<env> (there is no bare
        # "gcp-workload"), e.g. '["gcp-organization","gcp-workload-dev","gcp-workload-prod"]'.
        #
        # RECOMMENDED TFC_DRIFT_WORKSPACES value for the full GCP + AWS landing zone.
        # Set this repository variable to a JSON array covering every foundational and
        # workload workspace you want monitored (substitute real <env>/<name> values):
        #   [
        #     "gcp-organization",           # GCP control plane
        #     "gcp-workload-dev",               # GCP app envs (add gcp-workload-staging, gcp-workload-prod, ...)
        #     "aws-organization",       # AWS Organizations / SCPs / cost governance
        #     "aws-security",           # GuardDuty, Security Hub, Config, CloudTrail
        #     "aws-network",            # Transit Gateway, IPAM, Network Firewall
        #     "aws-identity",           # IAM Identity Center
        #     "aws-shared-services",    # Log archive, KMS, private CA, SSM
        #     "aws-backup",             # Org-wide AWS Backup
        #     "aws-workload-dev",       # AWS per-env workloads (aws-workload-<env>)
        #     "saas-web"                # SaaS workspaces (saas-<name>)
        #   ]
        # The inline default covers the full GCP control plane (all four roots of
        # the H3 split; gcp-network-hub holds the hub VPC) plus the dev workload AND
        # the AWS guardrail workspaces (aws-organization, aws-security, aws-network),
        # which hold the SCPs, GuardDuty/Config/CloudTrail and network guardrails an
        # attacker would tamper with. A workspace that does not exist (e.g. AWS on
        # a GCP-only estate) FAILS its leg unless REAL_CLOUD_CHECKS_OPT_OUT=true, so
        # a single-cloud estate sets TFC_DRIFT_WORKSPACES to its own workspaces
        # (and adds per-env workload or saas workspaces there).
        # yamllint disable-line rule:line-length
        workspace: ${{ fromJSON(vars.TFC_DRIFT_WORKSPACES || '["gcp-bootstrap","gcp-organization","gcp-projects","gcp-network-hub","gcp-workload-dev","aws-organization","aws-security","aws-network"]') }}
    steps:
      # Egress/process audit for this job (audit mode: observe, never block).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Assert Terraform Cloud credentials are configured
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN_DRIFT }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
        run: |
          if [ -z "$TFC_TOKEN" ]; then
            echo "::error::secrets.TFC_TOKEN_DRIFT is not set (no fallback to TFC_TOKEN)."
            exit 1
          fi
          test -n "$TFC_ORGANIZATION" || { echo "::error::vars.TFC_ORGANIZATION is not set."; exit 1; }

      - name: Fetch latest run status from Terraform Cloud
        id: run_status
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN_DRIFT }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          RUNS_URL="https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}"
          RUNS_URL="${RUNS_URL}/workspaces/${WORKSPACE}/runs?page%5Bsize%5D=1"
          response=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "${RUNS_URL}") \
            || { echo "::error::TFC API request failed for workspace '${WORKSPACE}'." \
              "Check TFC_TOKEN_DRIFT and TFC_ORGANIZATION. Response: ${response}" >&2; exit 1; }

          if ! echo "$response" | jq -e '.data | type == "array"' >/dev/null 2>&1; then
            echo "::error::Unexpected TFC API response format for workspace '${WORKSPACE}': ${response}" >&2
            exit 1
          fi

          status=$(echo "$response" | jq -r '.data[0].attributes.status // "none"')
          run_id=$(echo "$response" | jq -r '.data[0].id // "none"')
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Trigger speculative plan via Terraform Cloud API
        id: trigger_plan
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN_DRIFT }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          WORKSPACE: ${{ matrix.workspace }}
          OPT_OUT: ${{ vars.REAL_CLOUD_CHECKS_OPT_OUT }}
        run: |
          # Look up workspace ID. A missing workspace (HTTP 404) FAILS the leg: a
          # listed workspace that was never checked must not show green. Only
          # REAL_CLOUD_CHECKS_OPT_OUT=true turns it into a warning and a skip.
          # Any other non-200 status is a failure either way.
          WS_URL="https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}"
          WS_URL="${WS_URL}/workspaces/${WORKSPACE}"
          http_code=$(curl --silent --output /tmp/ws.json --write-out '%{http_code}' \
            --max-time 30 --connect-timeout 10 \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "${WS_URL}")
          if [ "$http_code" = "404" ]; then
            if [ "$OPT_OUT" = "true" ]; then
              echo "::warning::Workspace '${WORKSPACE}' does not exist in TFC org" \
                "'${TFC_ORGANIZATION}' and REAL_CLOUD_CHECKS_OPT_OUT=true: its drift" \
                "check did NOT run."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Workspace '${WORKSPACE}' does not exist in TFC org" \
              "'${TFC_ORGANIZATION}', so its drift check cannot run. Set the" \
              "TFC_DRIFT_WORKSPACES repository variable to this estate's workspaces," \
              "or set REAL_CLOUD_CHECKS_OPT_OUT=true to acknowledge the gap." >&2
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::TFC API returned ${http_code} for workspace" \
              "'${WORKSPACE}'. Response: $(cat /tmp/ws.json)" >&2
            exit 1
          fi
          ws_response=$(cat /tmp/ws.json)
          ws_id=$(echo "$ws_response" | jq -r '.data.id')
          if [ -z "$ws_id" ] || [ "$ws_id" = "null" ]; then
            echo "::error::Could not parse workspace ID from TFC response for '${WORKSPACE}'" >&2
            exit 1
          fi
          echo "workspace_id=${ws_id}" >> "$GITHUB_OUTPUT"

          # Trigger a speculative plan (drift check) using the latest configuration version
          run_response=$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            --data "{
              \"data\": {
                \"attributes\": {
                  \"message\": \"Drift detection run (automated)\",
                  \"plan-only\": true,
                  \"refresh\": true
                },
                \"type\": \"runs\",
                \"relationships\": {
                  \"workspace\": {
                    \"data\": { \"type\": \"workspaces\", \"id\": \"${ws_id}\" }
                  }
                }
              }
            }" \
            "https://app.terraform.io/api/v2/runs")
          drift_run_id=$(echo "$run_response" | jq -r '.data.id // empty')
          if [ -z "$drift_run_id" ]; then
            echo "::error::Could not queue a drift plan for '${WORKSPACE}': ${run_response}" >&2
            exit 1
          fi
          echo "drift_run_id=${drift_run_id}" >> "$GITHUB_OUTPUT"

      - name: Poll for plan result
        id: poll
        if: steps.trigger_plan.outputs.skipped != 'true'
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN_DRIFT }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          DRIFT_RUN_ID: ${{ steps.trigger_plan.outputs.drift_run_id }}
          # Mapped via env (not inlined into the run script) to avoid interpolating
          # an expression directly into shell — matches the pattern used elsewhere.
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          for i in $(seq 1 20); do
            sleep 30
            # ?include=plan: the resource-change counts live on the PLAN object,
            # not the run object (audit A1). Reading them off .data.attributes
            # (the run) always yielded null -> // 0 -> drift never detected.
            run_response=$(curl --silent --show-error \
              --header "Authorization: Bearer ${TFC_TOKEN}" \
              --header "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/runs/${DRIFT_RUN_ID}?include=plan")
            status=$(echo "$run_response" | jq -r '.data.attributes.status')
            # Pre-extract the plan's attributes object (audit A1) so each count
            # line stays short; default {} when no plan is included yet.
            pa='([.included[]?|select(.type=="plans").attributes][0] // {})'
            resource_additions=$(echo "$run_response" | jq -r "${pa}[\"resource-additions\"] // 0")
            resource_changes=$(echo "$run_response" | jq -r "${pa}[\"resource-changes\"] // 0")
            resource_destructions=$(echo "$run_response" | jq -r "${pa}[\"resource-destructions\"] // 0")
            echo "Attempt ${i}: status=${status} +${resource_additions} ~${resource_changes} -${resource_destructions}"
            case "$status" in
              planned_and_finished|planned)
                total=$((resource_additions + resource_changes + resource_destructions))
                echo "drift_detected=$([ "$total" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
                echo "resource_additions=${resource_additions}" >> "$GITHUB_OUTPUT"
                echo "resource_changes=${resource_changes}" >> "$GITHUB_OUTPUT"
                echo "resource_destructions=${resource_destructions}" >> "$GITHUB_OUTPUT"
                RUN_URL="https://app.terraform.io/app/${TFC_ORGANIZATION}"
                RUN_URL="${RUN_URL}/workspaces/${WORKSPACE}/runs/${DRIFT_RUN_ID}"
                echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              errored|canceled|discarded)
                echo "Plan run ended with status: ${status}" >&2
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for plan to complete" >&2
          exit 1

      - name: Open drift issue
        if: steps.poll.outputs.drift_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKSPACE: ${{ matrix.workspace }}
          # Route poll outputs through env (not inlined into the script) so no
          # workflow expression is interpolated directly into shell.
          RESOURCE_ADDITIONS: ${{ steps.poll.outputs.resource_additions }}
          RESOURCE_CHANGES: ${{ steps.poll.outputs.resource_changes }}
          RESOURCE_DESTRUCTIONS: ${{ steps.poll.outputs.resource_destructions }}
          RUN_URL: ${{ steps.poll.outputs.run_url }}
        run: |
          TITLE="[Drift] Infrastructure drift detected in workspace: ${WORKSPACE}"
          BODY="## Infrastructure Drift Detected

          Workspace **\`${WORKSPACE}\`** has drifted from the Terraform state.

          | Metric | Count |
          |--------|-------|
          | Additions | ${RESOURCE_ADDITIONS} |
          | Changes | ${RESOURCE_CHANGES} |
          | Destructions | ${RESOURCE_DESTRUCTIONS} |

          **Plan URL:** ${RUN_URL}

          Review and apply the changes to bring the workspace back into compliance.
          "

          # Check if an open drift issue already exists to avoid duplicates
          existing=$(gh issue list \
            --label "drift" \
            --state open \
            --search "\"[Drift]\" in:title workspace: ${WORKSPACE}" \
            --json number \
            --jq '.[0].number')

          if [ -z "$existing" ]; then
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "drift"
          else
            echo "Drift issue #${existing} already open for ${WORKSPACE}, skipping creation."
          fi

  summary:
    name: Drift Detection Summary
    runs-on: ubuntu-latest
    needs: [check-credentials, detect-drift]
    if: always()
    steps:
      # Egress/process audit for this job (audit mode: observe, never block).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Publish summary
        # needs.detect-drift.result is the aggregated matrix result:
        #   success  = ALL workspace jobs passed (no drift detected in any workspace)
        #   failure  = ONE or more workspace jobs failed (drift or API error)
        #   skipped  = credentials not configured (the check-credentials job failed,
        #              or passed only because REAL_CLOUD_CHECKS_OPT_OUT=true)
        # Individual per-workspace results appear as annotations on each matrix job.
        env:
          CONFIGURED: ${{ needs.check-credentials.outputs.configured }}
          RESULT: ${{ needs.detect-drift.result }}
          # yamllint disable-line rule:line-length
          WORKSPACES: ${{ vars.TFC_DRIFT_WORKSPACES || '["gcp-bootstrap","gcp-organization","gcp-projects","gcp-network-hub","gcp-workload-dev","aws-organization","aws-security","aws-network"]' }}
        run: |
          {
            echo "## Drift Detection Summary"
            echo ""
            if [ "$CONFIGURED" != "true" ]; then
              echo "⚠️ **Drift detection did NOT run — Terraform Cloud credentials are not configured.**"
              echo ""
              echo "Drift is unmonitored. Set the \`TFC_TOKEN_DRIFT\` repository secret and"
              echo "\`TFC_ORGANIZATION\` repository variable (docs/guides/CI_SECRETS.md)."
            elif [ "$RESULT" = "success" ]; then
              echo "✅ **All workspace plans completed — no drift detected.**"
            else
              echo "❌ **One or more workspace plans detected drift or encountered an error.**"
              echo ""
              echo "Check the individual matrix job steps above for Terraform Cloud run links and"
              echo "per-workspace change counts, or look for automatically opened GitHub Issues"
              echo "labelled \`drift\`."
            fi
            echo ""
            echo "**Configured workspaces** (\`TFC_DRIFT_WORKSPACES\` repository variable): \`${WORKSPACES}\`"
            echo ""
            echo "To override at runtime, use the workflow_dispatch input."
          } >> "$GITHUB_STEP_SUMMARY"
