name: Generate Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'modules/**/*.tf'
      - 'modules/**/README.md'
      - '.terraform-docs.yml'
      - 'scripts/module-docs.sh'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

# Nothing by default; the job grants only what it needs.
permissions: {}

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Generate Module Documentation
    runs-on: ubuntu-latest
    # Secrets for this job live in the `docs-bot` GitHub environment, restricted
    # to the default branch (docs/guides/CI_SECRETS.md "Environment-scoped
    # secrets"). A repo-level secret is readable by a workflow pushed to ANY
    # branch; an environment secret only by runs its branch policy allows.
    environment: docs-bot
    timeout-minutes: 15
    # Only the GITHUB_TOKEN fallback path uses these: with DOCS_BOT_PAT set,
    # create-pull-request pushes and opens the PR as the PAT's account.
    permissions:
      contents: write        # create-pull-request pushes a branch (fallback token)
      pull-requests: write   # ... and opens the PR
    steps:
      # Egress/process audit for this job (audit mode: observe, never block).
      # Not block yet: the terraform-docs release download redirects to a
      # GitHub asset CDN host that GitHub has changed before. Move to block
      # with the endpoints the StepSecurity audit log reports for this job.
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Do not leave a credential in .git/config for the steps that run
          # `make docs` (terraform-docs and repo scripts). The checkout uses the
          # default read-only clone; DOCS_BOT_PAT is passed only to
          # create-pull-request below, which authenticates its own push.
          persist-credentials: false

      - name: Install terraform-docs
        run: |
          TDOCS_VERSION=0.19.0
          BASE_URL="https://github.com/terraform-docs/terraform-docs/releases/download/v${TDOCS_VERSION}"
          TARBALL="terraform-docs-v${TDOCS_VERSION}-linux-amd64.tar.gz"
          CHECKSUM_FILE="terraform-docs-v${TDOCS_VERSION}.sha256sum"

          curl -sSLO "${BASE_URL}/${TARBALL}"
          curl -sSLO "${BASE_URL}/${CHECKSUM_FILE}"
          sha256sum --check --ignore-missing "${CHECKSUM_FILE}"
          tar -xz -C /usr/local/bin terraform-docs < "${TARBALL}"
          terraform-docs --version
          rm -f "${TARBALL}" "${CHECKSUM_FILE}"

      - name: Generate module documentation
        run: make docs

      - name: Create Pull Request for docs update
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8  # v8.1.2
        with:
          # GitHub does NOT trigger downstream workflows (terraform-plan.yml) on
          # PRs opened by GITHUB_TOKEN, so auto-generated docs PRs would bypass
          # validation. A fine-grained PAT opens the PR as its account and does
          # (docs/guides/CI_SECRETS.md "DOCS_BOT_PAT"). Falls back to
          # GITHUB_TOKEN when the secret is absent (forks / first-time setup).
          token: ${{ secrets.DOCS_BOT_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-generate module documentation"
          branch: "auto/docs-update"
          delete-branch: true
          title: "chore: auto-generated documentation update"
          body: |
            Automated documentation update generated by terraform-docs.

            This PR was created automatically by the documentation workflow.

            ⚠️ If CI checks are not running on this PR, configure the `DOCS_BOT_PAT`
            secret (see `docs/guides/CI_SECRETS.md`).
          labels: "documentation,automated"
          # Require review to prevent auto-merge of unvalidated documentation changes.
          # Set DOCS_REVIEWER to a GitHub username or use team-reviewers for team-based review.
          # Falls back to a repository variable (DOCS_REVIEWER) if set, otherwise empty
          # (no reviewer required). Override with team-reviewers: "infra-reviewers" if preferred.
          reviewers: ${{ vars.DOCS_REVIEWER }}
