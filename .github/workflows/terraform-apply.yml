name: Terraform Release Metadata

# Records a GitHub Release for a per-workspace deployment tag once HCP Terraform
# has applied the tagged commit. It applies nothing: HCP Terraform runs every
# plan and apply. The file keeps its historical name terraform-apply.yml because
# README.md, SECURITY.md, docs/INDEX.md, the runbooks and the CI guides link to
# it by path, and the tfc-readonly environment's documentation names it.

on:
  push:
    tags:
      - "gcp-bootstrap/v*"
      - "gcp-organization/v*"
      - "gcp-guardrails/v*"
      - "gcp-projects/v*"
      - "gcp-network-hub/v*"
      - "gcp-workload/*/v*"
      - "aws-*/v*"
      - "aws-workload/*/v*"
      - "saas/*/v*"
      - "tfc-admin/v*"

permissions: {}

concurrency:
  group: terraform-apply-${{ github.ref_name }}
  cancel-in-progress: false

# `shell: bash` runs every `run:` step as `bash -eo pipefail`: GitHub's
# default (no shell set) is `bash -e` without pipefail, so `cmd | tee log`
# would pass when cmd fails (scripts/check-workflow-pipefail.py).
defaults:
  run:
    shell: bash

jobs:
  verify-run:
    name: Verify Terraform Cloud Run
    runs-on: ubuntu-latest
    # Secrets for this job live in the `tfc-readonly` GitHub environment, restricted
    # to the deployment tags (gcp-*/v*, aws-*/v*, ...) (docs/guides/CI_SECRETS.md "Environment-scoped
    # secrets"). A repo-level secret is readable by a workflow pushed to ANY
    # branch; an environment secret only by runs its branch policy allows.
    environment: tfc-readonly
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      workspace: ${{ steps.parse.outputs.workspace }}
      release_name: ${{ steps.parse.outputs.release_name }}
      version: ${{ steps.parse.outputs.version }}
      status: ${{ steps.run_status.outputs.status }}
      commit_match: ${{ steps.run_commit.outputs.commit_match }}
    steps:
      # This job holds TFC_TOKEN (or TFC_TOKEN_GUARDRAILS) in one step only.
      # Its network calls are the GitHub compare API, the checkout of
      # scripts/verify-run-commit.sh from github.com and curl to the HCP
      # Terraform API, so all other egress is blocked.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            app.terraform.io:443
            github.com:443

      # CICD-1: a deployment tag must point at a commit on the default branch,
      # so a tag on an unreviewed branch commit gets no release. Runs before
      # any step that holds a secret. This check lives in the tagged commit's
      # workflow file, so a writer who also edits this file on that commit
      # bypasses it: the tag ruleset (docs/guides/CI_SECRETS.md) is the control
      # that stops a writer from creating deployment tags at all.
      - name: Check the tagged commit is on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          compare=$(gh api "repos/${REPO}/compare/${DEFAULT_BRANCH}...${TAG_COMMIT}" --jq .status)
          case "$compare" in
            identical|behind) ;;
            *)
              echo "::error::Tagged commit ${TAG_COMMIT} is not on ${DEFAULT_BRANCH} (compare status '${compare}')." \
                "Tag a commit that is merged to ${DEFAULT_BRANCH}." >&2
              exit 1
              ;;
          esac

      # Only the commit verifier, from the default branch (not the tagged
      # commit, CICD-1); no credentials kept.
      - name: Checkout the run-commit verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/verify-run-commit.sh
          sparse-checkout-cone-mode: false

      - name: Parse tag
        id: parse
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" == gcp-organization/* ]]; then
            VERSION="${TAG_NAME##*/}"
            {
              echo "workspace=gcp-organization"
              echo "release_name=GCP Organization ${VERSION}"
              echo "version=${VERSION}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == gcp-workload/* ]]; then
            # Tag shape: gcp-workload/<env>/v1.2.3 -> workspace gcp-workload-<env>
            ENVIRONMENT=$(echo "$TAG_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$TAG_NAME" | cut -d'/' -f3)
            {
              echo "workspace=gcp-workload-${ENVIRONMENT}"
              echo "release_name=GCP Workload ${ENVIRONMENT} ${VERSION}"
              echo "version=${VERSION}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == aws-workload/* ]]; then
            # Tag shape: aws-workload/<env>/v1.2.3 -> workspace aws-workload-<env>
            ENVIRONMENT=$(echo "$TAG_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$TAG_NAME" | cut -d'/' -f3)
            {
              echo "workspace=aws-workload-${ENVIRONMENT}"
              echo "release_name=AWS Workload ${ENVIRONMENT} ${VERSION}"
              echo "version=${VERSION}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == saas/* ]]; then
            # Tag shape: saas/<name>/v1.2.3 -> workspace saas-<name>
            NAME=$(echo "$TAG_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$TAG_NAME" | cut -d'/' -f3)
            {
              echo "workspace=saas-${NAME}"
              echo "release_name=SaaS ${NAME} ${VERSION}"
              echo "version=${VERSION}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == gcp-bootstrap/* || "$TAG_NAME" == gcp-guardrails/* \
                || "$TAG_NAME" == gcp-projects/* \
                || "$TAG_NAME" == gcp-network-hub/* || "$TAG_NAME" == tfc-admin/* \
                || "$TAG_NAME" == aws-organization/* || "$TAG_NAME" == aws-security/* \
                || "$TAG_NAME" == aws-network/* || "$TAG_NAME" == aws-identity/* \
                || "$TAG_NAME" == aws-shared-services/* || "$TAG_NAME" == aws-backup/* ]]; then
            # Tag shape: <root>/v1.2.3 -> single-account root workspace == first path segment
            WORKSPACE=$(echo "$TAG_NAME" | cut -d'/' -f1)
            VERSION=$(echo "$TAG_NAME" | cut -d'/' -f2)
            {
              echo "workspace=${WORKSPACE}"
              echo "release_name=${WORKSPACE} ${VERSION}"
              echo "version=${VERSION}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unrecognized release tag '$TAG_NAME'." >&2
            echo "Expected: gcp-{bootstrap,organization,guardrails,projects,network-hub}/v*," >&2
            echo "gcp-workload/<env>/v*, aws-*/v*, aws-workload/<env>/v*," >&2
            echo "saas/<name>/v*, tfc-admin/v*." >&2
            exit 1
          fi

      - name: Assert Terraform Cloud credentials are configured
        # TFC_TOKEN must be a Terraform Cloud team token scoped to READ access
        # on workspace runs only. It is used solely to verify run status before
        # publishing a GitHub release — it does not trigger or modify any run.
        # Create a dedicated team in TFC with "Read runs" permission and store
        # its token as the TFC_TOKEN secret (not an org-level or user token).
        # Drift detection needs to CREATE speculative runs and therefore uses a
        # SEPARATE token, TFC_TOKEN_DRIFT (Queue Plans). Keep the two distinct so
        # this release token stays read-only (see drift-detection.yml).
        # gcp-guardrails lives in a security-only project that TFC_TOKEN cannot
        # see, so its tags use TFC_TOKEN_GUARDRAILS (runs = read on that project
        # only; tfc-admin guardrails_release_reader_team_id). There is no
        # fallback: a guardrails tag without that secret fails here.
        env:
          TFC_TOKEN: >-
            ${{ startsWith(github.ref_name, 'gcp-guardrails/')
            && secrets.TFC_TOKEN_GUARDRAILS || secrets.TFC_TOKEN }}
          GUARDRAILS_TOKEN_SET: ${{ secrets.TFC_TOKEN_GUARDRAILS != '' }}
          TAG_NAME: ${{ github.ref_name }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
        run: |
          if [[ "$TAG_NAME" == gcp-guardrails/* && "$GUARDRAILS_TOKEN_SET" != "true" ]]; then
            echo "::error::TFC_TOKEN_GUARDRAILS is not set. gcp-guardrails tags need it" \
              "(docs/guides/CI_SECRETS.md)." >&2
            exit 1
          fi
          test -n "$TFC_TOKEN"
          test -n "$TFC_ORGANIZATION"

      - name: Fetch latest Terraform Cloud run
        id: run_status
        env:
          TFC_TOKEN: >-
            ${{ startsWith(github.ref_name, 'gcp-guardrails/')
            && secrets.TFC_TOKEN_GUARDRAILS || secrets.TFC_TOKEN }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          WORKSPACE: ${{ steps.parse.outputs.workspace }}
          RUNS_FILE: ${{ runner.temp }}/tfc-runs.json
        run: |
          RUNS_URL="https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}"
          RUNS_URL="${RUNS_URL}/workspaces/${WORKSPACE}/runs?page%5Bsize%5D=1&include=configuration_version.ingress_attributes"
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 30 --connect-timeout 10 \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "${RUNS_URL}") \
            || { echo "TFC API request failed — check TFC_TOKEN and TFC_ORGANIZATION secrets" >&2; exit 1; }

          # Validate that the response is valid JSON with a data array
          if ! echo "$response" | jq -e '.data | type == "array"' >/dev/null 2>&1; then
            echo "Unexpected TFC API response format: $response" >&2
            exit 1
          fi

          run_count=$(echo "$response" | jq '.data | length')
          if [ "$run_count" -eq 0 ]; then
            echo "No runs found for workspace ${WORKSPACE} — tag a release only after a run exists" >&2
            exit 1
          fi

          status=$(echo "$response" | jq -r '.data[0].attributes.status')
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          # Only `applied` means the infrastructure is actually deployed. The other
          # two statuses are accepted so the workflow can run and report, but the
          # release job below publishes a GitHub Release ONLY when status == applied
          # (see its `if:` conditions) so a release never falsely asserts a deploy.
          case "$status" in
            applied)
              # Run applied — infrastructure is live; release will be published.
              ;;
            planned_and_finished)
              # Plan-only run (no changes / speculative) — NOT applied; release held.
              ;;
            apply_queued)
              # Pending manual apply approval in TFC — NOT applied yet; release held.
              ;;
            *)
              echo "Latest Terraform Cloud run for ${WORKSPACE} is '${status}' —" \
                "expected applied, planned_and_finished, or apply_queued" >&2
              exit 1
              ;;
          esac

          # The response goes to a file for the next step, which runs the
          # verifier without the token (CICD-1).
          printf '%s' "$response" > "$RUNS_FILE"

      # L7: verify the run's source commit matches THIS tag's commit, so a
      # release never asserts a deploy of a different configuration. The commit
      # is in the ingress attributes of the run's configuration version, which
      # the runs API includes when asked for
      # include=configuration_version.ingress_attributes (above). A run with no
      # source commit (a CLI or API run) fails this job, so no release is
      # published: a release must point at a VCS run of the tagged commit. This
      # step has no TFC token in its environment.
      - name: Verify the run commit
        id: run_commit
        env:
          TAG_COMMIT: ${{ github.sha }}
          RUNS_FILE: ${{ runner.temp }}/tfc-runs.json
        run: ./scripts/verify-run-commit.sh < "$RUNS_FILE" >> "$GITHUB_OUTPUT"

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify-run
    permissions:
      contents: write
    steps:
      # This job holds a contents: write token. Its only network call is the
      # gh CLI to the GitHub API, so all other egress is blocked.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Create release summary
        # Tag-derived values reach the shell through env, never by expression
        # interpolation into the script: a crafted tag name must not run code.
        env:
          WORKSPACE: ${{ needs.verify-run.outputs.workspace }}
          VERSION: ${{ needs.verify-run.outputs.version }}
          STATUS: ${{ needs.verify-run.outputs.status }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- Workspace: ${WORKSPACE}"
            echo "- Version: ${VERSION}"
            echo "- Terraform Cloud status: ${STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        # Publish a Release only when the infrastructure is actually applied AND the
        # applied run's source commit matches this tag (L7), so a release tag can
        # never assert a deploy that is only queued, plan-only, or of a different
        # configuration than the tag points at.
        # The runner's gh CLI does this with the job token, so no third-party
        # action holds contents: write. A re-run updates the existing release.
        if: needs.verify-run.outputs.status == 'applied' && needs.verify-run.outputs.commit_match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NAME: ${{ needs.verify-run.outputs.release_name }}
          WORKSPACE: ${{ needs.verify-run.outputs.workspace }}
          STATUS: ${{ needs.verify-run.outputs.status }}
        run: |
          notes="Terraform Cloud workspace \`${WORKSPACE}\` was successfully applied (status \`${STATUS}\`)."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes "$notes"
          else
            gh release create "$TAG_NAME" --verify-tag --title "$RELEASE_NAME" --notes "$notes"
          fi

      - name: Release held (not applied or commit mismatch)
        # Non-applied statuses (apply_queued / planned_and_finished) or a tag whose
        # commit does not match the applied run (L7) do not publish a release;
        # record why so the tag's state is traceable instead of silently missing.
        if: needs.verify-run.outputs.status != 'applied' || needs.verify-run.outputs.commit_match != 'true'
        env:
          TAG_NAME: ${{ github.ref_name }}
          STATUS: ${{ needs.verify-run.outputs.status }}
          COMMIT_MATCH: ${{ needs.verify-run.outputs.commit_match }}
        run: |
          {
            echo "## Release held"
            echo ""
            echo "No GitHub Release was published for tag \`${TAG_NAME}\`."
            echo "Terraform Cloud status is \`${STATUS}\`."
            echo "Commit match: \`${COMMIT_MATCH}\` (need applied/true)."
            echo "Re-run this workflow (or re-tag) once the matching apply completes to publish the release."
          } >> "$GITHUB_STEP_SUMMARY"
