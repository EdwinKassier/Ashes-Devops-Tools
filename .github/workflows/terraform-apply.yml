name: Terraform Release Metadata

on:
  push:
    tags:
      - "gcp-organization/v*"
      - "gcp-workload/*/v*"
      - "aws-*/v*"
      - "aws-workload/*/v*"
      - "saas/*/v*"

permissions: {}

concurrency:
  group: terraform-apply-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-run:
    name: Verify Terraform Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      workspace: ${{ steps.parse.outputs.workspace }}
      release_name: ${{ steps.parse.outputs.release_name }}
      version: ${{ steps.parse.outputs.version }}
      status: ${{ steps.run_status.outputs.status }}
    steps:
      - name: Parse tag
        id: parse
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" == gcp-organization/* ]]; then
            VERSION="${TAG_NAME##*/}"
            echo "workspace=gcp-organization" >> "$GITHUB_OUTPUT"
            echo "release_name=GCP Organization ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == gcp-workload/* ]]; then
            # Tag shape: gcp-workload/<env>/v1.2.3 -> workspace gcp-workload-<env>
            ENVIRONMENT=$(echo "$TAG_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$TAG_NAME" | cut -d'/' -f3)
            echo "workspace=gcp-workload-${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
            echo "release_name=GCP Workload ${ENVIRONMENT} ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == aws-workload/* ]]; then
            # Tag shape: aws-workload/<env>/v1.2.3 -> workspace aws-workload-<env>
            ENVIRONMENT=$(echo "$TAG_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$TAG_NAME" | cut -d'/' -f3)
            echo "workspace=aws-workload-${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
            echo "release_name=AWS Workload ${ENVIRONMENT} ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == saas/* ]]; then
            # Tag shape: saas/<name>/v1.2.3 -> workspace saas-<name>
            NAME=$(echo "$TAG_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$TAG_NAME" | cut -d'/' -f3)
            echo "workspace=saas-${NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=SaaS ${NAME} ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == aws-organization/* || "$TAG_NAME" == aws-security/* \
                || "$TAG_NAME" == aws-network/* || "$TAG_NAME" == aws-identity/* \
                || "$TAG_NAME" == aws-shared-services/* || "$TAG_NAME" == aws-backup/* ]]; then
            # Tag shape: <root>/v1.2.3 -> single-account root workspace == first path segment
            WORKSPACE=$(echo "$TAG_NAME" | cut -d'/' -f1)
            VERSION=$(echo "$TAG_NAME" | cut -d'/' -f2)
            echo "workspace=${WORKSPACE}" >> "$GITHUB_OUTPUT"
            echo "release_name=${WORKSPACE} ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unrecognized release tag '$TAG_NAME'." >&2
            echo "Expected: gcp-organization/v*, gcp-workload/<env>/v*," >&2
            echo "aws-*/v*, aws-workload/<env>/v*, saas/<name>/v*." >&2
            exit 1
          fi

      - name: Assert Terraform Cloud credentials are configured
        # TFC_TOKEN must be a Terraform Cloud team token scoped to READ access
        # on workspace runs only. It is used solely to verify run status before
        # publishing a GitHub release — it does not trigger or modify any run.
        # Create a dedicated team in TFC with "Read runs" permission and store
        # its token as the TFC_TOKEN secret (not an org-level or user token).
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
        run: |
          test -n "$TFC_TOKEN"
          test -n "$TFC_ORGANIZATION"

      - name: Fetch latest Terraform Cloud run
        id: run_status
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          WORKSPACE: ${{ steps.parse.outputs.workspace }}
        run: |
          RUNS_URL="https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}"
          RUNS_URL="${RUNS_URL}/workspaces/${WORKSPACE}/runs?page%5Bsize%5D=1"
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 30 --connect-timeout 10 \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "${RUNS_URL}") \
            || { echo "TFC API request failed — check TFC_TOKEN and TFC_ORGANIZATION secrets" >&2; exit 1; }

          # Validate that the response is valid JSON with a data array
          if ! echo "$response" | jq -e '.data | type == "array"' >/dev/null 2>&1; then
            echo "Unexpected TFC API response format: $response" >&2
            exit 1
          fi

          run_count=$(echo "$response" | jq '.data | length')
          if [ "$run_count" -eq 0 ]; then
            echo "No runs found for workspace ${WORKSPACE} — tag a release only after a run exists" >&2
            exit 1
          fi

          status=$(echo "$response" | jq -r '.data[0].attributes.status')
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          # Only `applied` means the infrastructure is actually deployed. The other
          # two statuses are accepted so the workflow can run and report, but the
          # release job below publishes a GitHub Release ONLY when status == applied
          # (see its `if:` conditions) so a release never falsely asserts a deploy.
          case "$status" in
            applied)
              # Run applied — infrastructure is live; release will be published.
              ;;
            planned_and_finished)
              # Plan-only run (no changes / speculative) — NOT applied; release held.
              ;;
            apply_queued)
              # Pending manual apply approval in TFC — NOT applied yet; release held.
              ;;
            *)
              echo "Latest Terraform Cloud run for ${WORKSPACE} is '${status}' —" \
                "expected applied, planned_and_finished, or apply_queued" >&2
              exit 1
              ;;
          esac

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify-run
    permissions:
      contents: write
    steps:
      - name: Create release summary
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workspace: ${{ needs.verify-run.outputs.workspace }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ needs.verify-run.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform Cloud status: ${{ needs.verify-run.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        # Publish a Release only when the infrastructure is actually applied, so a
        # release tag can never assert a deploy that is only queued or plan-only.
        if: needs.verify-run.outputs.status == 'applied'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: ${{ needs.verify-run.outputs.release_name }}
          tag_name: ${{ github.ref_name }}
          body: >-
            Terraform Cloud workspace `${{ needs.verify-run.outputs.workspace }}`
            was successfully applied (status `${{ needs.verify-run.outputs.status }}`).

      - name: Release held (run not applied)
        # Non-applied statuses (apply_queued / planned_and_finished) do not publish a
        # release; record why so the tag's state is traceable instead of silently missing.
        if: needs.verify-run.outputs.status != 'applied'
        run: |
          {
            echo "## Release held"
            echo ""
            echo "No GitHub Release was published for tag \`${{ github.ref_name }}\`."
            echo "Terraform Cloud status is \`${{ needs.verify-run.outputs.status }}\`, not \`applied\`."
            echo "Re-run this workflow (or re-tag) once the apply completes to publish the release."
          } >> "$GITHUB_STEP_SUMMARY"
