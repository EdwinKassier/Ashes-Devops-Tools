AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ashes landing zone, AWS phase 0 (management account). Creates the HCP
  Terraform OIDC provider, the tfc-mgmt-plan / tfc-mgmt-apply roles that the
  aws-organization workspace assumes through TFC dynamic credentials (and that
  aws-security / aws-backup use until aws-organization creates their dedicated
  roles), and the MFA-gated OrganizationBreakGlass role. Deploy ONCE, as a
  plain stack in the management account, before the first aws-organization
  run. See docs/runbooks/aws-bootstrap.md, Step 2 (Option B).

# The trust policies are full JSON documents built with Fn::Sub, because their
# condition KEYS embed the TFC hostname ("<host>:sub"), and a YAML mapping key
# cannot be an intrinsic function.

Parameters:
  TfcHostname:
    Type: String
    Default: app.terraform.io
    Description: HCP Terraform / TFE hostname (app.terraform.io, app.eu.terraform.io, or your TFE host).
    AllowedPattern: "^[a-z0-9.-]+$"
  TfcOrganization:
    Type: String
    Description: TFC organization name (org.tfc.organization). Matched literally, never wildcarded.
    AllowedPattern: "^[A-Za-z0-9_-]+$"
  TfcProject:
    Type: String
    Default: landing-zone-aws
    Description: TFC project of the aws-* workspaces (org.tfc.aws_project, default <project_name_prefix>aws).
  TrustSecurityAndBackup:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Also trust aws-security and aws-backup on the management ADMIN role.
      Default "false": the first aws-organization apply creates their dedicated
      tfc-mgmt-aws-security-* / tfc-mgmt-aws-backup-* roles, and tfc-admin binds
      them. Set "true" only for a recovery run (or when
      enable_tfc_management_roles is false), then set it back.
  BreakGlassTrustedPrincipalArn:
    Type: String
    Description: >-
      IAM principal allowed to assume the break-glass role: a dedicated IAM
      user or role whose credentials live in a sealed process. MFA is always
      required.
    AllowedPattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:(user|role)/.+$"
  BreakGlassActive:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Standby (false, default): a deny-all inline policy keeps the role inert.
      Activate during an incident with a stack update to "true", and set it back
      afterwards (docs/runbooks/aws-break-glass.md).
  BreakGlassMfaMaxAgeSeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 43200

Conditions:
  TrustSecurityAndBackupApply:
    Fn::Equals:
      - Ref: TrustSecurityAndBackup
      - "true"
  BreakGlassStandby:
    Fn::Equals:
      - Ref: BreakGlassActive
      - "false"

Resources:
  TfcOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url:
        Fn::Sub: "https://${TfcHostname}"
      ClientIdList:
        - aws.workload.identity

  TfcMgmtPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tfc-mgmt-plan
      Description: Terraform Cloud PLAN phase for the management-account workspaces (read-only, no data-plane reads).
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      # ReadOnlyAccess includes data-plane and secret-bearing reads. This is the
      # same deny as the member-account tfc-plan role (modules/aws/iam/
      # tfc-oidc-baseline: plan_role_data_read_deny_actions and the API key
      # paths). scripts/tests/test-phase0-template.sh fails when the two differ.
      # No management-account root manages a resource whose refresh needs a
      # denied read, so there is no exempt-ARN list here.
      # deny-self-tampering (SEC-4): the same statements as
      # DenyManagementRoleTampering and DenyMemberAccountPivot in
      # modules/aws/iam/tfc-management-roles (scripts/tests/test-phase0-template.sh
      # fails when the actions differ). Neither phase-0 role may rewrite the
      # trust, policies or boundary of tfc-mgmt-plan, tfc-mgmt-apply or
      # OrganizationBreakGlass, or assume OrganizationAccountAccessRole in a
      # member account. The roles are named exactly, not tfc-mgmt-*: the
      # aws-organization apply creates and edits the dedicated
      # tfc-mgmt-<workspace>-plan/apply roles. Change these three roles with a
      # stack update as a human administrator.
      Policies:
        - PolicyName: data-read-deny
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyDataPlaneReads
                Effect: Deny
                Action:
                  - "s3:GetObject*"
                  - "s3-object-lambda:GetObject*"
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:BatchGetSecretValue"
                  - "ssm:GetParameter*"
                  - "kms:Decrypt"
                  - "kms:GenerateDataKey*"
                  - "ec2:GetPasswordData"
                  - "ec2:GetConsoleOutput"
                  - "ec2:GetConsoleScreenshot"
                  - "ec2:GetLaunchTemplateData"
                  - "ec2:DescribeLaunchTemplateVersions"
                  - "autoscaling:DescribeLaunchConfigurations"
                  - "glue:GetConnection"
                  - "glue:GetConnections"
                  - "dynamodb:GetItem"
                  - "dynamodb:BatchGetItem"
                  - "dynamodb:Query"
                  - "dynamodb:Scan"
                  - "dynamodb:PartiQLSelect"
                  - "dynamodb:GetRecords"
                  - "sqs:ReceiveMessage"
                  - "kinesis:GetRecords"
                  - "logs:GetLogEvents"
                  - "logs:FilterLogEvents"
                  - "logs:StartQuery"
                  - "logs:GetQueryResults"
                  - "logs:StartLiveTail"
                  - "rds-data:*"
                  - "redshift-data:GetStatementResult"
                  - "athena:GetQueryResults"
                  - "timestream:Select"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:BatchGetImage"
                  - "ecr:GetAuthorizationToken"
                  - "ssm:GetCommandInvocation"
                  - "logs:GetLogRecord"
                  - "rds:DownloadDBLogFilePortion"
                  - "es:ESHttpGet"
                  - "cassandra:Select"
                  - "codecommit:GitPull"
                  - "codecommit:GetFile"
                  - "codecommit:GetBlob"
                  - "codeartifact:ReadFromRepository"
                  - "codebuild:BatchGetProjects"
                  - "codebuild:BatchGetBuilds"
                  - "lambda:GetLayerVersion"
                  - "cognito-idp:DescribeUserPoolClient"
                  - "appsync:ListApiKeys"
                  - "states:GetExecutionHistory"
                  - "states:DescribeExecution"
                  - "lightsail:GetInstanceAccessDetails"
                  - "lightsail:GetRelationalDatabaseMasterUserPassword"
                  - "glacier:GetJobOutput"
                  - "elasticbeanstalk:DescribeConfigurationSettings"
                Resource: "*"
              - Sid: DenyApiKeyValueReads
                Effect: Deny
                Action: "apigateway:GET"
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:apigateway:*::/apikeys"
                  - Fn::Sub: "arn:${AWS::Partition}:apigateway:*::/apikeys/*"
                  - Fn::Sub: "arn:${AWS::Partition}:apigateway:*::/usageplans/*/keys"
                  - Fn::Sub: "arn:${AWS::Partition}:apigateway:*::/usageplans/*/keys/*"
        - PolicyName: deny-self-tampering
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyManagementRoleTampering
                Effect: Deny
                Action:
                  - "iam:AttachRolePolicy"
                  - "iam:DeleteRole"
                  - "iam:DeleteRolePermissionsBoundary"
                  - "iam:DeleteRolePolicy"
                  - "iam:DetachRolePolicy"
                  - "iam:PutRolePermissionsBoundary"
                  - "iam:PutRolePolicy"
                  - "iam:UpdateAssumeRolePolicy"
                  - "iam:UpdateRole"
                  - "iam:TagRole"
                  - "iam:UntagRole"
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tfc-mgmt-plan"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tfc-mgmt-apply"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/OrganizationBreakGlass"
              - Sid: DenyMemberAccountPivot
                Effect: Deny
                Action:
                  - "sts:AssumeRole"
                  - "sts:TagSession"
                  - "sts:SetSourceIdentity"
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iam::*:role/OrganizationAccountAccessRole"
      AssumeRolePolicyDocument:
        Fn::Sub: |-
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Federated": "${TfcOidcProvider}"},
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {"StringEquals": {
                "${TfcHostname}:aud": "aws.workload.identity",
                "${TfcHostname}:sub": [
                  "organization:${TfcOrganization}:project:${TfcProject}:workspace:aws-organization:run_phase:plan",
                  "organization:${TfcOrganization}:project:${TfcProject}:workspace:aws-security:run_phase:plan",
                  "organization:${TfcOrganization}:project:${TfcProject}:workspace:aws-backup:run_phase:plan"
                ]
              }}
            }]
          }

  TfcMgmtApplyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tfc-mgmt-apply
      Description: Terraform Cloud APPLY phase for aws-organization (management account admin).
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      # deny-self-tampering (SEC-4), as on tfc-mgmt-plan: the same statements as
      # DenyManagementRoleTampering and DenyMemberAccountPivot in
      # modules/aws/iam/tfc-management-roles (scripts/tests/test-phase0-template.sh
      # fails when the actions differ). Neither phase-0 role may rewrite the
      # trust, policies or boundary of tfc-mgmt-plan, tfc-mgmt-apply or
      # OrganizationBreakGlass, or assume OrganizationAccountAccessRole in a
      # member account. The roles are named exactly, not tfc-mgmt-*: the
      # aws-organization apply creates and edits the dedicated
      # tfc-mgmt-<workspace>-plan/apply roles. Change these three roles with a
      # stack update as a human administrator.
      # AdministratorAccess stays: aws-organization manages the organization
      # itself. This deny stops the role from making its own trust or the
      # break-glass role wider; it does not make the role least-privilege.
      Policies:
        - PolicyName: deny-self-tampering
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyManagementRoleTampering
                Effect: Deny
                Action:
                  - "iam:AttachRolePolicy"
                  - "iam:DeleteRole"
                  - "iam:DeleteRolePermissionsBoundary"
                  - "iam:DeleteRolePolicy"
                  - "iam:DetachRolePolicy"
                  - "iam:PutRolePermissionsBoundary"
                  - "iam:PutRolePolicy"
                  - "iam:UpdateAssumeRolePolicy"
                  - "iam:UpdateRole"
                  - "iam:TagRole"
                  - "iam:UntagRole"
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tfc-mgmt-plan"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/tfc-mgmt-apply"
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/OrganizationBreakGlass"
              - Sid: DenyMemberAccountPivot
                Effect: Deny
                Action:
                  - "sts:AssumeRole"
                  - "sts:TagSession"
                  - "sts:SetSourceIdentity"
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:iam::*:role/OrganizationAccountAccessRole"
      AssumeRolePolicyDocument:
        Fn::If:
          - TrustSecurityAndBackupApply
          - Fn::Sub: |-
              {
                "Version": "2012-10-17",
                "Statement": [{
                  "Effect": "Allow",
                  "Principal": {"Federated": "${TfcOidcProvider}"},
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {"StringEquals": {
                    "${TfcHostname}:aud": "aws.workload.identity",
                    "${TfcHostname}:sub": [
                      "organization:${TfcOrganization}:project:${TfcProject}:workspace:aws-organization:run_phase:apply",
                      "organization:${TfcOrganization}:project:${TfcProject}:workspace:aws-security:run_phase:apply",
                      "organization:${TfcOrganization}:project:${TfcProject}:workspace:aws-backup:run_phase:apply"
                    ]
                  }}
                }]
              }
          - Fn::Sub: |-
              {
                "Version": "2012-10-17",
                "Statement": [{
                  "Effect": "Allow",
                  "Principal": {"Federated": "${TfcOidcProvider}"},
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {"StringEquals": {
                    "${TfcHostname}:aud": "aws.workload.identity",
                    "${TfcHostname}:sub": [
                      "organization:${TfcOrganization}:project:${TfcProject}:workspace:aws-organization:run_phase:apply"
                    ]
                  }}
                }]
              }

  OrganizationBreakGlass:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OrganizationBreakGlass
      Description: >-
        Emergency access. MFA required, one-hour sessions, every assumption
        alarmed by aws-security; exempt from the deny-tamper SCPs by name.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      Policies:
        Fn::If:
          - BreakGlassStandby
          - - PolicyName: standby-deny-all
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: InertUntilActivated
                    Effect: Deny
                    Action: "*"
                    Resource: "*"
          - Ref: AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Ref: BreakGlassTrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
              NumericLessThan:
                aws:MultiFactorAuthAge:
                  Ref: BreakGlassMfaMaxAgeSeconds

Outputs:
  TerraformRunRoleArn:
    Description: aws.terraform_run_role_arn in config/landing-zone.yaml, and tfc-admin aws_management_apply_role_arn.
    Value:
      Fn::GetAtt: [TfcMgmtApplyRole, Arn]
  PlanRoleArn:
    Description: tfc-admin aws_management_plan_role_arn.
    Value:
      Fn::GetAtt: [TfcMgmtPlanRole, Arn]
  BreakGlassRoleArn:
    Description: aws.break_glass_role_arn in config/landing-zone.yaml.
    Value:
      Fn::GetAtt: [OrganizationBreakGlass, Arn]
