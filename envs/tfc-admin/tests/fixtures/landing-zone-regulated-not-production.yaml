    organization: cfg-tfc
    project_name_prefix: lz-
    aws_project: aws-landing-zone
    plan: standard
    vcs_repo:
      identifier: cfg/landing-zone
      github_app_installation_id: ghain-123
gcp:
  enabled: true
  environments:
    dev: {cidr_block: 10.10.0.0/16, is_production: false}
    pci: {cidr_block: 10.30.0.0/16, is_production: false, compliance_class: regulated}
