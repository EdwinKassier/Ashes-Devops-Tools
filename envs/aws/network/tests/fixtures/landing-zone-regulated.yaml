# Test fixture: starter profile with one regulated, non-production workload
# environment. The class, not the profile or is_production, drives the egress
# gate and the Network Firewall (root.tftest.hcl).
version: 1
org:
  name: cfgco
  profile: starter
  owner: cfg-platform
  cost_center: cc-1234
  tfc:
    organization: cfg-tfc
aws:
  log_archive_bucket_name: cfgco-org-log-archive
  workload_environments:
    dev: {is_production: false, account_key: workload_dev}
    pci: {is_production: false, account_key: workload_pci, compliance_class: regulated}
  contracts:
    organization:
      organization_id: o-cfgcfgcfg0
      management_account_id: "012345678901"
      account_ids:
        network: "066666666666"
  network:
    egress_domain_allowlist: [.amazonaws.com]
    stateful_default_actions: [aws:drop_established, aws:alert_established]
    vpc_endpoint_policy_mode: org_principals_and_resources
