# Test fixture: minimum AWS footprint (aws.layers: []) for the aws-organization
# root (config.tftest.hcl). shared_services stays: aws-security and the
# IAM Identity Center delegation need it.
version: 1
org:
  name: cfgco
  owner: cfg-platform
  cost_center: cc-1234
  regions:
    aws: eu-west-1
  tfc:
    organization: cfg-tfc
    project_name_prefix: cfg-
aws:
  management_account_id: "012345678901"
  allowed_regions: [eu-west-1, eu-west-2]
  enabled_regions: [eu-west-1, us-east-1]
  guard_alert_emails: [secops@cfg.test]
  enable_org_config_recorders: true
  enable_config_recorder_scp: true
  terraform_run_role_arn: arn:aws:iam::012345678901:role/tfc-mgmt-apply
  break_glass_role_arn: arn:aws:iam::012345678901:role/break-glass
  log_archive_bucket_name: cfgco-org-log-archive
  layers: []
  accounts:
    log_archive: {email: aws+log-archive@cfg.test, ou: Security}
    security_tooling: {email: aws+security-tooling@cfg.test, ou: Security}
    shared_services: {email: aws+shared-services@cfg.test, ou: Infrastructure}
    forensics: {email: aws+forensics@cfg.test, ou: Security}
  workload_accounts:
    workload_nonprod: {email: aws+workload-nonprod@cfg.test, ou: Workloads}
    workload_prod: {email: aws+workload-prod@cfg.test, ou: Workloads}
  workload_environments:
    dev: {is_production: false, account_key: workload_nonprod}
    staging: {is_production: false, account_key: workload_nonprod}
    prod: {is_production: true, account_key: workload_prod, vpc_cidr: 10.40.0.0/16}
